name: my-first-workflow
# To get trigger 
on: 
#push:
 schedule:
  - cron: "*/5 * * * *"
 workflow_dispatch:
env: 
 ENV_TYPE: DEV
 APP_USER: dubeys8
 APP_PORT : 8080
jobs:
  job1:
   name: JOB1
   runs-on: ubuntu-latest
   steps:
     - name: Running single command in job 1
       run: echo "Hi This is my firest Github workflow"
     - name : checking OS-Release background
       run: cat /etc/os-release 
  job2:
    needs: job1
    name:  JOB02
    runs-on: ubuntu-latest
    steps:
      - name: checking the hostname
        run: hostname
      - name: running multiple commands
        run: | 
         echo "Hi from Saurabh Dubey"
         ps -ef
         df -lk
         cat /etc/passwd
  job3:
    needs: job2
    name: JOB03
    runs-on: ubuntu-22.04
    steps:
      - name : small step
        run: sleep 10
  job4:
    needs: job1
    name: JOB04
    runs-on: ubuntu-22.04
    steps:
      - name : small step
        run: sleep 20   
  job5:
   name: checkout repost
   runs-on: ubuntu-latest
   steps:
    - name : checkout step
      uses : actions/checkout@v4.0.0
    - name: check readme file
      run : |
       cat README.md
       touch saurabh.txt
       ls -lrt >> saurabh.txt
       pwd >> saurabh.txt
       echo "Actor_name : ${{github.actor}}">> saurabh.txt
       echo "Event_name : ${{github.event_name}}">>saurabh.txt
    - name: Upload Generated File as Artifact
      uses: actions/upload-artifact@v4.0.0
      with:
       name: saurabh-log-file
       path: saurabh.txt
  job6:  
   needs : job1
   name: Display the env variables
   runs-on: ubuntu-latest
   steps:
    - name : step1
      run : |
       echo "The Environment Type is $ENV_TYPE"
       echo " The User is $APP_USER"
       echo " The Post is $APP_PORT"
    - name : "referring env secret"
      run: |
       echo "[INFO] Application Password is ${{secrets.APP_PASSWORD}}"
       echo "Hi Saurabh Bhai"
       echo " ${{github.actor}}"
       echo " This is running on :: ${{runner.os}}"
  job7:
   name : Stage_dep 
   runs-on: ubuntu-latest
   steps:
   - name : referring Environment variable
     run : echo "[INFO} Running deployment on ${{ vars.USER }}"
 
   
   
